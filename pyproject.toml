[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classifire"
version = "0.1.0"
description = "Passive-fire estimating and technical decision-support system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Ceasefire PFP"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "typer>=0.16,<1",
  "rich>=14,<16",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
  "reportlab>=4.4,<5",
  "xlsxwriter>=3.2,<4",
  "Pillow>=11,<13",
  "python-dateutil>=2.9,<3",
  "pypdf>=5.8,<7",
  "PyMuPDF>=1.26,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3"
]
postgres = ["psycopg[binary]>=3.2,<4"]
malware = ["clamd>=1.0,<2"]

[project.scripts]
classifire = "classifire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["classifire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["knowledge/source", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
exclude = "knowledge/source|data"
