release_id: QF-KNOWLEDGE-ROUTING-v0.2-dev
status: DEVELOPMENT_BLOCKED
production_authority: false
source_requirement:
  required_product: QUANTIFIRE
  required_version: '2.13'
  required_package: '13'
  verification_status: PENDING
  rule: 'No earlier PFEOS or QUANTIFIRE release may be substituted for active v2.13 routing authority.'
legacy_lineage:
  pfeos_v2_8:
    status: HISTORICAL_MIGRATION_REFERENCE_ONLY
    runtime_authority: false
    use: 'Compatibility analysis and migration comparison only.'
authority_order:
  - platform_safety_and_security
  - verified_quantifire_v2_13_constitution_and_governance
  - approved_runtime_profiles
  - verified_quantifire_v2_13_package_13_routing_and_release_manifest
  - confirmed_project_evidence
  - verified_quantifire_v2_13_package_15_technical_authority
  - verified_quantifire_v2_13_package_14_commercial_authority
  - authorised_user_instruction
hard_stage_order:
  - evidence_intake
  - physical_model
  - physical_model_lock
  - opening_specific_technical_search
  - repair_strategy_lock
  - component_derivation
  - quantity_and_labour
  - commercial_pricing_and_recovery
  - independent_validation
  - validated_snapshot
  - output_rendering
  - human_release
negative_routing:
  intake_evidence:
    deny: [package_14_pricing]
  physical_model:
    deny: [package_14_pricing, final_technical_approval]
  technical_system:
    deny: [package_14_pricing, commercial_approval]
  commercial_engine:
    deny: [technical_applicability_override]
  output:
    deny: [recalculation, technical_selection, pricing_mutation]
package_authority:
  package_13: BLOCKED_PENDING_VERIFIED_V2_13_SOURCE
  package_14: COMMERCIAL_ONLY_PENDING_EXACT_V2_13_SOURCE_HASH_VERIFICATION
  package_15: TECHNICAL_ONLY_PENDING_EXACT_V2_13_SOURCE_HASH_VERIFICATION
  package_16: BLOCKED_PENDING_VERIFIED_V2_13_SOURCE_AND_PROFILE_SPLIT_REAPPROVAL
canonical_state:
  owner: quantifire_domain_service
  mission_control_is_canonical: false
  agent_memory_is_canonical: false
  direct_agent_database_writes_allowed: false
required_runtime_receipts:
  - quantifire_v2_13_release_ids
  - source_hashes
  - agent_id
  - run_id
  - lock_receipts
  - validation_receipt
  - output_hashes
