name: CLASSIFIRE validation

on:
  pull_request:

  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  validation:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      containment-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classifire_containment_test
          POSTGRES_USER: classifire_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classifire_test -d classifire_containment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLASSIFIRE_ENV: test
      CLASSIFIRE_DATABASE_URL: sqlite:///./classifire-ci.db
      CLASSIFIRE_POSTGRES_TEST_URL: postgresql+psycopg://classifire_test@127.0.0.1:5432/classifire_containment_test
      CLASSIFIRE_POSTGRES_TEST_DESTRUCTIVE_OPT_IN: classifire-containment-test-drop-all
      CLASSIFIRE_STORAGE_ROOT: .classifire-ci-storage
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install application and development tools
        run: python -m pip install -e ".[dev,postgres,chatgpt]"

      - name: Check changed Python code style
        shell: bash
        if: github.event_name == 'pull_request'
        run: |
          # A structural migration relocation is a pure rename. New or modified
          # migration modules must still receive the normal changed-file style check.
          git diff -z --name-only --diff-filter=ACM origin/$GITHUB_BASE_REF...HEAD -- '*.py' |
            xargs -0 --no-run-if-empty python -m ruff check --no-cache

      - name: Check merged Python code style
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff -z --name-only --diff-filter=ACM "$BEFORE_SHA" "$HEAD_SHA" -- '*.py' |
            xargs -0 --no-run-if-empty python -m ruff check --no-cache
      - name: Run full Ruff check
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -p no:cacheprovider --basetemp .pytest-ci

      - name: Run full type check
        run: python -m mypy src

      - name: Run full security scan
        run: python -m bandit -q -r src

      - name: Verify one Alembic migration head
        shell: bash
        run: |
          python -m alembic heads |
            awk 'NF { count += 1 } END { exit count == 1 ? 0 : 1 }'
