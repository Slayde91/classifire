{# Presentation only: all content, forms, authority and saved revisions use the existing handlers. #}
<section data-workbench-content
         data-draft-id="{{ draft.id }}"
         data-capability="{{ workbench_capability }}"
         data-scope-revision="{{ scope.revision }}"
         data-scope-sha256="{{ scope.sha256 }}"
         data-artifact-id="{{ envelope.artifact_id if envelope else '' }}"
         data-artifact-revision="{{ envelope.revision if envelope else '' }}"
         data-artifact-sha256="{{ envelope.sha256 if envelope else '' }}"
         data-opening-id="{{ evidence.selection.opening_id or '' if workbench_capability == 'evidence' else envelope.target.opening_id or '' if envelope and workbench_capability == 'system' else '' }}"
         data-service-id="{{ evidence.selection.service_id or '' if workbench_capability == 'evidence' else envelope.target.service_id or '' if envelope and workbench_capability == 'system' else '' }}">
  <h2>{% block heading %}{% endblock %}</h2>
  {% block content %}{% endblock %}
</section>
